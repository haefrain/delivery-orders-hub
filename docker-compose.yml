services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: delivery_hub
    ports:
      # 5433 on the host: macOS dev machines often run a native postgres on 5432
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d delivery_hub']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: delivery-orders-hub-app
    command: sh -c "pnpm exec prisma migrate deploy && node dist/main.js"
    environment: &app-env
      DATABASE_URL: postgresql://hub:hub@postgres:5432/delivery_hub
      REDIS_URL: redis://redis:6379
      RAPPI_WEBHOOK_SECRET: local-rappi-secret
      UBEREATS_WEBHOOK_SECRET: local-ubereats-secret
      DIDI_WEBHOOK_SECRET: local-didi-secret
      DASHBOARD_ORIGIN: http://localhost:8080
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: delivery-orders-hub-app
    command: node dist/worker.main.js
    environment: *app-env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
